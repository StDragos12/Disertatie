runtime: python311
entrypoint: gunicorn -b :$PORT app:app --timeout 300 --workers 1 --worker-class gthread --threads 4

instance_class: F4_1G

env_variables:
  GCS_BUCKET_NAME: "ndvi-spectral-arrays-plucky-environs-416709"
  GOOGLE_CLOUD_PROJECT: "plucky-environs-416709"
  ALLOW_LIVE_USER_ML_FALLBACK: "false"

automatic_scaling:
  min_instances: 0
  max_instances: 1