name: Deploy to App Engine

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/343145196185/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@plucky-environs-416709.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud
        run: gcloud info

      - name: Deploy to App Engine
        run: gcloud app deploy app.yaml --project=plucky-environs-416709 --quiet
