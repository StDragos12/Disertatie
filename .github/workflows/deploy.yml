name: Deploy to App Engine

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/343145196185/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@plucky-environs-416709.iam.gserviceaccount.com

      - uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: plucky-environs-416709
          deliverables: app.yaml