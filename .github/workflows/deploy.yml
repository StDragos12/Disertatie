name: Deploy to App Engine

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository source
        run: |
          echo "Deploying commit:"
          git rev-parse HEAD
          echo "Latest commit:"
          git log -1 --oneline
          echo "Using app.yaml from repository:"
          cat app.yaml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/343145196185/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@plucky-environs-416709.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy repository code to App Engine
        run: |
          VERSION_ID="v-${GITHUB_SHA::12}"

          gcloud app deploy app.yaml \
            --project=plucky-environs-416709 \
            --version="$VERSION_ID" \
            --promote \
            --stop-previous-version \
            --quiet

      - name: Verify deployed version
        run: |
          VERSION_ID="v-${GITHUB_SHA::12}"

          gcloud app versions describe "$VERSION_ID" \
            --service=default \
            --project=plucky-environs-416709 \
            --format="yaml(id,instanceClass,runtime,automaticScaling,envVariables,servingStatus)"

      - name: Delete old App Engine versions with no traffic
        run: |
          CURRENT_VERSION="v-${GITHUB_SHA::12}"

          OLD_VERSIONS=$(gcloud app versions list \
            --service=default \
            --project=plucky-environs-416709 \
            --filter="traffic_split=0 AND version.id!=$CURRENT_VERSION" \
            --format="value(version.id)")

          if [ -z "$OLD_VERSIONS" ]; then
            echo "No old versions to delete."
          else
            echo "$OLD_VERSIONS" | xargs -r gcloud app versions delete \
              --service=default \
              --project=plucky-environs-416709 \
              --quiet
          fi
