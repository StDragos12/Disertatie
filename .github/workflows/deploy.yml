name: Deploy to App Engine

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployed commit and files
        run: |
          echo "Commit deployed:"
          git rev-parse HEAD
          echo "Repository files:"
          ls -la
          echo "App yaml:"
          cat app.yaml
          echo "Check ML page markers:"
          grep -R "summary-dashboard" blueprints/main.py || true
          grep -R "Număr pixeli pentru antrenare" blueprints/main.py || true
          grep -R "F4_1G" app.yaml || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/343145196185/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@plucky-environs-416709.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud
        run: gcloud info

      - name: Deploy to App Engine
        run: |
          VERSION_ID="v-${GITHUB_SHA::12}"

          echo "Deploying version: $VERSION_ID"

          gcloud app deploy app.yaml \
            --project=plucky-environs-416709 \
            --version="$VERSION_ID" \
            --promote \
            --stop-previous-version \
            --quiet

      - name: Verify deployed version
        run: |
          VERSION_ID="v-${GITHUB_SHA::12}"

          gcloud app versions describe "$VERSION_ID" \
            --service=default \
            --project=plucky-environs-416709 \
            --format="yaml(id,instanceClass,runtime,envVariables,automaticScaling,servingStatus)"

      - name: Delete old App Engine versions with no traffic
        run: |
          CURRENT_VERSION="v-${GITHUB_SHA::12}"

          OLD_VERSIONS=$(gcloud app versions list \
            --service=default \
            --project=plucky-environs-416709 \
            --filter="traffic_split=0 AND version.id!=$CURRENT_VERSION" \
            --format="value(version.id)")

          if [ -z "$OLD_VERSIONS" ]; then
            echo "No old versions to delete."
          else
            echo "$OLD_VERSIONS" | xargs -r gcloud app versions delete \
              --service=default \
              --project=plucky-environs-416709 \
              --quiet
          fi
